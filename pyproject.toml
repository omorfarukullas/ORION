[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-assistant"
version = "2.0.0"
description = "Operational Responsive Intelligent Orchestration Network — Local-first AI Voice Assistant"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Omor Faruck Ullas", email = "omor.farukh16@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["voice-assistant", "desktop-automation", "whisper", "offline-ai", "customtkinter", "speech-recognition"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/omorfarukullas/ORION"
Documentation = "https://github.com/omorfarukullas/ORION#readme"
Repository = "https://github.com/omorfarukullas/ORION.git"
Issues = "https://github.com/omorfarukullas/ORION/issues"
Changelog = "https://github.com/omorfarukullas/ORION/blob/main/CHANGELOG.md"

[project.scripts]
orion = "app:main"
orion-web = "api.server:run_api_server"
