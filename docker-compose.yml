version: '3.8'

services:
  orion-node:
    build: .
    container_name: orion-assistant
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./database:/app/database
      - ./logs:/app/logs
      - ./plugins:/app/plugins
      - ./config:/app/config
    environment:
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8080
      - OLLAMA_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
